<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Metric improvement on the same 32 questions</title>
  <desc id="desc">Five colored lines show faithfulness, answer relevancy, context precision, context recall, and behavior match across dense retrieval, hybrid retrieval, reranking, filtering, and Self-RAG.</desc>
  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Metric improvement on the same 32 questions</text>

  <g stroke="#d9e0ea" stroke-width="1">
    <line x1="100" y1="100" x2="1000" y2="100"/>
    <line x1="100" y1="160" x2="1000" y2="160"/>
    <line x1="100" y1="220" x2="1000" y2="220"/>
    <line x1="100" y1="280" x2="1000" y2="280"/>
    <line x1="100" y1="340" x2="1000" y2="340"/>
    <line x1="100" y1="400" x2="1000" y2="400"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#667085" text-anchor="end">
    <text x="88" y="105">1.0</text>
    <text x="88" y="165">0.8</text>
    <text x="88" y="225">0.6</text>
    <text x="88" y="285">0.4</text>
    <text x="88" y="345">0.2</text>
    <text x="88" y="405">0.0</text>
  </g>
  <line x1="100" y1="400" x2="1000" y2="400" stroke="#98a2b3" stroke-width="2"/>
  <line x1="100" y1="100" x2="100" y2="400" stroke="#98a2b3" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="14" fill="#344054" text-anchor="middle">
    <text x="100" y="430">Dense</text>
    <text x="325" y="430">Hybrid</text>
    <text x="550" y="430">Reranking</text>
    <text x="775" y="430">Filtering</text>
    <text x="1000" y="430">Self-RAG</text>
  </g>

  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <polyline stroke="#2563eb" points="100,196 325,181 550,166 775,154 1000,142"/>
    <polyline stroke="#16a34a" points="100,184 325,172 550,160 775,151 1000,142"/>
    <polyline stroke="#d97706" points="100,205 325,184 550,160 775,145 1000,136"/>
    <polyline stroke="#dc2626" points="100,217 325,193 550,169 775,148 1000,136"/>
    <polyline stroke="#7c3aed" points="100,175 325,157 550,142 775,127 1000,112"/>
  </g>
  <g>
    <g fill="#2563eb"><circle cx="100" cy="196" r="5"/><circle cx="325" cy="181" r="5"/><circle cx="550" cy="166" r="5"/><circle cx="775" cy="154" r="5"/><circle cx="1000" cy="142" r="5"/></g>
    <g fill="#16a34a"><circle cx="100" cy="184" r="5"/><circle cx="325" cy="172" r="5"/><circle cx="550" cy="160" r="5"/><circle cx="775" cy="151" r="5"/><circle cx="1000" cy="142" r="5"/></g>
    <g fill="#d97706"><circle cx="100" cy="205" r="5"/><circle cx="325" cy="184" r="5"/><circle cx="550" cy="160" r="5"/><circle cx="775" cy="145" r="5"/><circle cx="1000" cy="136" r="5"/></g>
    <g fill="#dc2626"><circle cx="100" cy="217" r="5"/><circle cx="325" cy="193" r="5"/><circle cx="550" cy="169" r="5"/><circle cx="775" cy="148" r="5"/><circle cx="1000" cy="136" r="5"/></g>
    <g fill="#7c3aed"><circle cx="100" cy="175" r="5"/><circle cx="325" cy="157" r="5"/><circle cx="550" cy="142" r="5"/><circle cx="775" cy="127" r="5"/><circle cx="1000" cy="112" r="5"/></g>
  </g>

  <g font-family="Arial, sans-serif" font-size="15" fill="#344054">
    <line x1="120" y1="490" x2="150" y2="490" stroke="#2563eb" stroke-width="4"/><text x="160" y="495">Faithfulness</text>
    <line x1="330" y1="490" x2="360" y2="490" stroke="#16a34a" stroke-width="4"/><text x="370" y="495">Answer relevancy</text>
    <line x1="590" y1="490" x2="620" y2="490" stroke="#d97706" stroke-width="4"/><text x="630" y="495">Context precision</text>
    <line x1="120" y1="530" x2="150" y2="530" stroke="#dc2626" stroke-width="4"/><text x="160" y="535">Context recall</text>
    <line x1="330" y1="530" x2="360" y2="530" stroke="#7c3aed" stroke-width="4"/><text x="370" y="535">Behavior match (%)</text>
  </g>
  <text x="550" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#667085">Behavior match is normalized on the chart: 0.96 represents 96%.</text>
</svg>
