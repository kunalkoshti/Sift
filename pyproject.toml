[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["log_generator*", "log_collector*", "sift_common*"]

[project]
name = "Sift"
version = "0.1.0"
description = "Shared Python dependencies for Sift services"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]
log_generator = [
    "faker>=24,<40",
    "httpx>=0.27,<1",
]
log_collector = [
    "fastapi>=0.115,<1",
    "python-dotenv>=1,<2",
    "redis>=5,<6",
    "uvicorn[standard]>=0.30,<1",
]
