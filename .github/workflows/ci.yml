name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect deployable changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      api: ${{ steps.filter.outputs.api }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            api:
              - 'log_api/**'
              - 'sift_common/**'
              - 'db/schema.sql'
              - 'pyproject.toml'
              - 'cloudbuild.yaml'
              - '.env.example'

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,log_generator,log_collector,log_consumer,log_api]"

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Run tests
        run: >-
          python -m pytest
          evaluation
          log_collector
          log_consumer
          log_embedder
          log_generator
          log_api
          -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy-api:
    name: Deploy log-api to Cloud Run
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.api == 'true'
    needs: [changes, test]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY || 'sift' }}
      LOG_API_SERVICE: ${{ vars.LOG_API_SERVICE || 'sift-log-api' }}
      VERCEL_FRONTEND_URL: ${{ vars.VERCEL_FRONTEND_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate deployment configuration
        run: |
          test -n "${GCP_PROJECT_ID}"
          test -n "${GCP_REGION}"
          test -n "${VERCEL_FRONTEND_URL}"
          test -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          test -n "${{ secrets.GCP_SERVICE_ACCOUNT }}"

      - name: Build and push log-api image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          export IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/log-api:${IMAGE_TAG}"

          # Build on the GitHub runner and push directly to Artifact Registry.
          # This avoids gcloud builds submit uploading source to the
          # project Cloud Build staging bucket.
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build \
            --file log_api/Dockerfile \
            --tag "${IMAGE}" \
            .
          docker push "${IMAGE}"
          echo "LOG_API_IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy log-api
        run: |
          gcloud run deploy "${LOG_API_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --image "${LOG_API_IMAGE}" \
            --port 8080 \
            --max 1 \
            --allow-unauthenticated \
            --quiet

      - name: Set API CORS for the Vercel production URL
        run: |
          gcloud run services update "${LOG_API_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --update-env-vars="CORS_ORIGINS=${VERCEL_FRONTEND_URL}" \
            --quiet

      - name: Check deployed API
        run: |
          API_URL="$(gcloud run services describe "${LOG_API_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format='value(status.url)')"
          curl --fail --silent --show-error "${API_URL}/health"

  deploy-frontend:
    name: Deploy frontend to Vercel
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.frontend == 'true'
    needs: [changes, test]
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate Vercel configuration
        run: |
          test -n "${VERCEL_ORG_ID}"
          test -n "${VERCEL_PROJECT_ID}"
          test -n "${{ secrets.VERCEL_TOKEN }}"

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy frontend and build on Vercel
        run: vercel deploy --prod --token="${{ secrets.VERCEL_TOKEN }}"
