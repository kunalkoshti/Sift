[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["log_generator*", "log_collector*", "log_consumer*", "log_embedder*", "log_api*", "sift_common*"]

[project]
name = "Sift"
version = "0.1.0"
description = "Shared Python dependencies for Sift services"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]
log_generator = [
    "faker>=24,<40",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
]
log_collector = [
    "fastapi>=0.115,<1",
    "python-dotenv>=1,<2",
    "redis>=5,<6",
    "uvicorn[standard]>=0.30,<1",
]
log_consumer = [
    "asyncpg>=0.29,<1",
    "python-dotenv>=1,<2",
    "redis>=5,<6",
]
log_embedder = [
    "asyncpg>=0.29,<1",
    "numpy>=1.26,<3",
    "python-dotenv>=1,<2",
    "sentence-transformers>=3,<6",
]
log_api = [
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "langchain-core>=0.3,<1",
    "langchain-openai>=0.3,<1",
    "langchain-ollama>=0.2,<1",
    "numpy>=1.26,<3",
    "python-dotenv>=1,<2",
    "sentence-transformers>=3,<6",
    "uvicorn[standard]>=0.30,<1",
]
