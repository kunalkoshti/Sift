services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  log-collector:
    build:
      context: .
      dockerfile: log_collector/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM: ${REDIS_STREAM}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sift
      POSTGRES_USER: sift
      POSTGRES_PASSWORD: sift
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-raw-logs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sift -d sift"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: 2048
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-model-init:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama-data:/root/.ollama
    command: ["pull", "${LLM_MODEL}"]

  log-consumer:
    build:
      context: .
      dockerfile: log_consumer/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM: ${REDIS_STREAM}
      REDIS_GROUP: ${REDIS_GROUP}
      REDIS_CONSUMER: ${REDIS_CONSUMER}
      REDIS_READ_COUNT: ${REDIS_READ_COUNT}
      REDIS_BLOCK_MS: ${REDIS_BLOCK_MS}
      REDIS_GROUP_START_ID: ${REDIS_GROUP_START_ID}
      POSTGRES_DSN: postgresql://sift:sift@postgres:5432/sift
      LOG_LEVEL: ${LOG_LEVEL}

  log-embedder:
    build:
      context: .
      dockerfile: log_embedder/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://sift:sift@postgres:5432/sift
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      CHUNK_WINDOW_SECONDS: ${CHUNK_WINDOW_SECONDS}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE}
      MAX_RECORDS_PER_CHUNK: ${MAX_RECORDS_PER_CHUNK}
      HF_HOME: /root/.cache/huggingface
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - model-cache:/root/.cache/huggingface

  log-api:
    build:
      context: .
      dockerfile: log_api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://sift:sift@postgres:5432/sift
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      OLLAMA_BASE_URL: http://ollama:11434
      GROQ_BASE_URL: ${GROQ_BASE_URL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      HF_HOME: /root/.cache/huggingface
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - model-cache:/root/.cache/huggingface
    ports:
      - "8001:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redis-data:
  postgres-data:
  model-cache:
  ollama-data:
